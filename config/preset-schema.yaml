# Strict runtime preset model. The TypeScript registry is authoritative.
common:
  required: [name, summary, domain, mode]
  optional: [aliases, browser_profile]
  modes: [content, links, nav-links]
content:
  required: [handler, schema]
  optional: [url_patterns]
links:
  required: [selector]
  optional: [toggle_selector]
nav-links:
  required: [section_selector, category_selector]
  optional: [toggle_selector]
