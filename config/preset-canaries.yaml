# Public URLs and semantic invariants for `agentscrape check-presets --live`.
# A canary URL is published with the repository, so it must be a durable public
# resource rather than a page the operator happens to have open. Presets with
# nothing that qualifies carry no canary; check-presets only probes what is
# listed here.
deepwiki-wiki-page:
  url: "https://deepwiki.com/facebook/react"
  invariants:
    require_title: true
    min_markdown_chars: 200
