name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Run project checks
        run: bun run check

      - name: Validate installer shell and plist portably
        run: |
          bash -n scripts/install.sh
          AGENTSCRAPE_INSTALL_LAUNCHCTL=none bash scripts/install.sh --help >/dev/null
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          with Path("plist/agentscrape.process-queue.plist").open("rb") as stream:
              plist = plistlib.load(stream)
          assert plist["Label"] == "agentscrape.process-queue"
          assert plist["ProgramArguments"] == ["__AGENTSCRAPE_PROGRAM__", "process-queue"]
          PY

      - name: Check patch whitespace
        run: git diff --check
