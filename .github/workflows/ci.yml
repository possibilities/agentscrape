name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Run project checks
        run: bun run check

      - name: Validate shell scripts
        shell: bash
        run: |
          bash -n scripts/check-hermetic.sh scripts/install.sh
          AGENTSCRAPE_INSTALL_LAUNCHCTL=none bash scripts/install.sh --help >/dev/null
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --severity=error scripts/check-hermetic.sh scripts/install.sh
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            printf 'shellcheck is required on the Ubuntu runner\n' >&2
            exit 1
          else
            printf 'shellcheck unavailable on the macOS runner; continuing\n' >&2
          fi

      - name: Validate plist with Python
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          with Path("plist/agentscrape.process-queue.plist").open("rb") as stream:
              plist = plistlib.load(stream)
          assert plist["Label"] == "agentscrape.process-queue"
          assert plist["ProgramArguments"] == ["__AGENTSCRAPE_PROGRAM__", "process-queue"]
          PY

      - name: Lint plist with macOS plutil
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if command -v plutil >/dev/null 2>&1; then
            plutil -lint plist/agentscrape.process-queue.plist
          else
            printf 'plutil unavailable on the macOS runner; continuing\n' >&2
          fi

      - name: Check whitespace and clean worktree
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status" >&2
          fi
          [[ -z "$status" ]]
