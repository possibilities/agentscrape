name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Install PDF dependency on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Install PDF dependency on macOS
        if: runner.os == 'macOS'
        run: brew install poppler

      - name: Run project checks
        run: bun run check

      - name: Run coverage gate
        if: runner.os == 'Linux'
        run: bun run coverage

      - name: Upload coverage LCOV
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov-ubuntu-24.04
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: error

      - name: Validate shell scripts
        shell: bash
        run: |
          bash -n scripts/check-hermetic.sh scripts/install.sh
          AGENTSCRAPE_INSTALL_LAUNCHCTL=none bash scripts/install.sh --help >/dev/null
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --severity=error scripts/check-hermetic.sh scripts/install.sh
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            printf 'shellcheck is required on the Ubuntu runner\n' >&2
            exit 1
          else
            printf 'shellcheck unavailable on the macOS runner; continuing\n' >&2
          fi

      - name: Check whitespace and clean worktree
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status" >&2
          fi
          [[ -z "$status" ]]
